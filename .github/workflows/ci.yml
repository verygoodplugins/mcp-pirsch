name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test release workflow
        run: npm run test:release-workflow

      - name: Test coverage
        run: npm run test:coverage

  test:
    name: test
    needs: test-node
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Node-version test job to pass
        run: test "${{ needs.test-node.result }}" = 'success'
